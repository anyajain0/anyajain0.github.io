name: Import Figma home assets

on:
  push:
    branches:
      - figma-home-redesign
    paths:
      - .github/workflows/import-figma-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: figma-home-redesign

      - name: Download exact Figma artwork renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/figma-home
          curl --fail --location --retry 3 -o img/figma-home/selected-work-1.png 'https://www.figma.com/api/mcp/asset/ea2cbdb0-4c8a-42ce-bc2b-939314c85ea2.png'
          curl --fail --location --retry 3 -o img/figma-home/selected-work-2.png 'https://www.figma.com/api/mcp/asset/826ae589-cbaa-4f15-b977-e9ab6a79faf8.png'
          curl --fail --location --retry 3 -o img/figma-home/selected-work-3.png 'https://www.figma.com/api/mcp/asset/27331436-f9db-4a20-9d46-356ac437b35d.png'
          curl --fail --location --retry 3 -o img/figma-home/selected-work-4.png 'https://www.figma.com/api/mcp/asset/31cdfa1a-767a-47b2-ac81-3c44896de120.png'

      - name: Point homepage at permanent local assets
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          replacements = {
              'https://www.figma.com/api/mcp/asset/850f221c-3a5b-4546-8b7f-7a5e3feb541f.png': 'img/figma-home/selected-work-1.png',
              'https://www.figma.com/api/mcp/asset/19457673-d396-4e7a-8133-30effe3df1a1.png': 'img/figma-home/selected-work-2.png',
              'https://www.figma.com/api/mcp/asset/1f874d90-3900-4c2b-b838-1fa5a9664dc0.png': 'img/figma-home/selected-work-3.png',
              'https://www.figma.com/api/mcp/asset/1f0f9f32-1210-4e68-8259-2d8af7f5baba.png': 'img/figma-home/selected-work-4.png',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          path.write_text(html)

      - name: Commit permanent assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html img/figma-home/
          git diff --cached --quiet && exit 0
          git commit -m 'Commit Figma home artwork assets'
          git push origin HEAD:figma-home-redesign
