name: Refresh Figma home assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-figma-home-assets.yml

permissions:
  contents: write

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download 4x Figma exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/figma-home
          curl --fail --location --retry 3 -o img/figma-home/selected-work-1.png 'https://www.figma.com/api/mcp/asset/ac954b7e-a840-47a2-8015-7b7b293eeae5.png'
          curl --fail --location --retry 3 -o img/figma-home/selected-work-2.png 'https://www.figma.com/api/mcp/asset/ffec34dc-a50f-4aa2-923e-b5ef3489a767.png'
          curl --fail --location --retry 3 -o img/figma-home/selected-work-3.png 'https://www.figma.com/api/mcp/asset/19b00eaa-474d-45e0-a613-82f257d6d19a.png'
          curl --fail --location --retry 3 -o img/figma-home/selected-work-4.png 'https://www.figma.com/api/mcp/asset/733c6b6d-af53-4584-9408-880e403accce.png'

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-figma-home-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/figma-home/ .github/workflows/refresh-figma-home-assets.yml
          git commit -m 'Replace homepage art with 4x Figma exports'
          git push origin HEAD:main
