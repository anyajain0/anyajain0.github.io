name: Publish portfolio assets

on:
  push:
    paths:
      - '.github/workflows/publish-portfolio-assets.yml'

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
