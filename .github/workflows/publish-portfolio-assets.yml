name: Publish interactive portfolio

on:
  push:
    paths:
      - '.github/workflows/publish-portfolio-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write approved portfolio homepage
        shell: bash
        env:
          PAGE_GZ_B64: ''
        run: |
          printf '%s' "$PAGE_GZ_B64" | base64 -d | gzip -d > index.html
          test -s index.html
      - name: Commit portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish interactive portfolio'
          git push
