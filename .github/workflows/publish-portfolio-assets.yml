name: Publish portfolio assets

on:
  push:
    paths:
      - '.github/workflows/publish-portfolio-assets.yml'

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/portfolio-slides img/figma-home /tmp/portfolio-unpacked

          # Current Figma homepage artwork + polygon vectors.
          curl -L --fail --retry 3 -o img/figma-home/figure-1.png 'https://www.figma.com/api/mcp/asset/f9dbb623-f99e-40b2-9035-a8735dd843ed.png'
          curl -L --fail --retry 3 -o img/figma-home/figure-2.png 'https://www.figma.com/api/mcp/asset/1bf21b5b-48d0-4875-bcd5-f23163e9fb2a.png'
          curl -L --fail --retry 3 -o img/figma-home/figure-3.png 'https://www.figma.com/api/mcp/asset/e72337d9-9c89-41d9-9f1a-baa5d8f867ca.png'
          curl -L --fail --retry 3 -o img/figma-home/figure-4.png 'https://www.figma.com/api/mcp/asset/295b8721-5002-405d-8989-a31dcde8bfca.png'
          curl -L --fail --retry 3 -o img/figma-home/polygon-1.svg 'https://www.figma.com/api/mcp/asset/1042942f-20ad-45b6-afc7-ae1518b5ba17.svg'
          curl -L --fail --retry 3 -o img/figma-home/polygon-2.svg 'https://www.figma.com/api/mcp/asset/9b2b68e2-5793-4b20-9a92-66dba03425c9.svg'
          curl -L --fail --retry 3 -o img/figma-home/polygon-3.svg 'https://www.figma.com/api/mcp/asset/7908b903-61da-43a8-86e8-17d267d54d79.svg'
          curl -L --fail --retry 3 -o img/figma-home/polygon-4.svg 'https://www.figma.com/api/mcp/asset/71c4b79b-02bd-42fd-8819-fe7456174e29.svg'

          # Download the actual Google Slides deck as PPTX, then copy its original media files.
          curl -L --fail --retry 3 -o /tmp/portfolio.pptx 'https://docs.google.com/presentation/d/1V43G-vVa8GV4R0NZrBnWENe7KWKoU6atFZbv2FShRrM/export/pptx'
          unzip -q /tmp/portfolio.pptx -d /tmp/portfolio-unpacked

          for name in image1.png image3.png image5.png image6.png image8.png image10.png image11.png image12.png image13.png image14.png image15.png image16.png image17.png image18.png image20.png image21.png image22.png image19.jpg; do
            cp "/tmp/portfolio-unpacked/ppt/media/$name" "img/portfolio-slides/$name"
          done

          test -s img/portfolio-slides/image21.png
          test -s img/figma-home/figure-1.png

      - name: Commit downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/portfolio-slides img/figma-home/figure-*.png img/figma-home/polygon-*.svg
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Add portfolio assets from Slides and Figma'
          git push
